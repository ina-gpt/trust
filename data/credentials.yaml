# =============================================================================
# CANONICAL SOURCE OF TRUTH — INA GPT GmbH trust and compliance register.
#
# Every published surface is GENERATED from this file: the trust repository
# pages, the organisation profile, the block injected into each public
# repository, trust.json and security.txt. Nothing downstream is hand-edited.
# If a fact is wrong, it is wrong here, in one place.
#
# THE RULE THAT GOVERNS EVERY ENTRY
#   `status: held` is a claim that a third party has issued something and that
#   a reader can check it. It therefore requires an identifier, an issuer and a
#   primary-source link. Anything without those renders under "In progress —
#   not yet held", with its date and no badge. There is no middle state, because
#   a middle state is where an unverifiable claim survives.
#
# TWO DIVERGENCES FROM THE WRITTEN SPEC, BOTH DELIBERATE
#
#   1. gaia-x has NO `logo` field. The specification listed one. There is no
#      written logo-use permission on file for the Gaia-X mark — the estate's
#      permission register (private) records one only for Adra. R5 says: no
#      permission record, no file. Inventing a record to satisfy a field would
#      be the exact failure the rule exists to prevent, so the field is absent
#      and the gap is reported instead.
#
#   2. `contact` carries more than the spec listed. A richer, RFC 9116-compliant
#      security.txt was ALREADY live and not stale (Expires 2027-03-09), with an
#      Acknowledgments page, a Hiring link and a dedicated security role address.
#      Generating a poorer file over a working one would be a regression, so the
#      existing fields were folded into the canonical data rather than dropped.
#      One source of truth is the point; losing working content is not.
# =============================================================================

