# =============================================================================
# MARKS — every third-party mark INA GPT GmbH DISPLAYS, and its permission.
#
# A mark is a stronger claim than a line of text: it borrows another
# organisation's trade dress. So each one needs a recorded permission AND a
# credential_ref pointing at an entry whose status is `held`.
#
# V10 enforces both. That second half is what makes the defect this section was
# created for impossible to reintroduce: the site footer displayed the KI
# Bundesverband mark while this register carried that membership as
# verification_pending — two surfaces asserting the same thing at different
# confidence levels, which is exactly the state a compliance register exists to
# make impossible.
#
# `grantor` here is an ORGANISATION, never a named individual. Who signed a
# permission is personal data with no lawful basis for publication (R8); that
# evidence lives in the private register.
# =============================================================================
marks:
