# =============================================================================
# MARKS — every third-party mark INA GPT GmbH DISPLAYS, and its permission.
#
# A mark is a stronger claim than a line of text: it borrows another
# organisation's trade dress. So each one needs a recorded permission AND a
# credential_ref pointing at an entry whose status is `held`.
#
# V10 enforces both. That second half is what makes the defect this section was
# created for impossible to reintroduce: the site footer displayed the KI
# Bundesverband mark while this register carried that membership as
# verification_pending — two surfaces asserting the same thing at different
# confidence levels, which is exactly the state a compliance register exists to
# make impossible.
#
# `grantor` here is an ORGANISATION, never a named individual. Who signed a
# permission is personal data with no lawful basis for publication (R8); that
# evidence lives in the private register.
# =============================================================================
# ── HOW THE MARKS ARE SIZED ─────────────────────────────────────────────────
# Policy as DATA, not as a constant buried in a component, because the renderer
# and the gate that checks resolution must agree and there must be one place to
# read the rule.
#
# WHY "consistent visual height" is not "equal box height", measured 2026-09-12:
#   a common 40px box rendered Gaia-X at 22.3px of actual ink against Adra's
#   34.5px — a third smaller while nominally identical.
# And why equal INK height is not enough either:
#   ink coverage inside the ink box ranges from 0.056 (Gaia-X: a sparse
#   wordmark beside a dotted glyph) to 0.387 (Adra: a dense logotype), so equal
#   ink boxes still read at very different weights. Equalising ink MASS is not
#   the answer either — it would put Gaia-X at 296px, eleven times the others.
# And why a height rule alone is still not enough:
#   KI Bundesverband's asset is 4151x798 (ratio 5.2). Height-normalised it
#   rendered ~360px wide and dominated the row on area regardless of height.
#
# So: normalise ink height, apply a BOUNDED coverage boost for sparse marks,
# then cap the width. Every number below was chosen by rendering the five marks
# at candidate values and comparing them, not by taste alone.
mark_render_policy:
  target_ink_px: 26
  max_width_px: 120
  coverage_boost_exponent: 0.2
  coverage_boost_max: 1.8
  coverage_reference: adra-member
  formula: >-
    box_height_px = max(18, round(min(
      (target_ink_px / ink_fraction) * clamp((ref_coverage / ink_coverage) ^ exponent, 1, boost_max),
      max_width_px / source_ratio)))

