certifications:
  - id: iso-27001
    name: "ISO/IEC 27001:2022 — Information Security Management System"
    status: held
    issuer: "TÜV SÜD Management Service GmbH"
    identifier: "12 310 71178 TMS"
    scope_en: "Operation and provision of an AI-powered platform"
    scope_de: "Betrieb und Bereitstellung einer KI gestützten Plattform"
    valid_from: "2026-08-10"
    valid_to: "2029-08-09"
    statement_of_applicability: "v1.7 (2026-08-04)"
    # FUNDSTELLE IS PER-LOCALE, AND THAT WAS MEASURED, NOT ASSUMED.
    #
    # The register carried /ms-zert while the English mark artwork on the site
    # carried /ms-cert, which looked like an inconsistency to fix by picking
    # one. OCR of the certifier's own deployed artwork (2026-09-12) shows both
    # are correct and are LOCALE VARIANTS of the same Fundstelle:
    #   tuv-iso27001-badge-de.png -> www.tuvsud.com/ms-zert   (Zertifikat)
    #   tuv-iso27001-badge-en.png -> www.tuvsud.com/ms-cert   (certificate)
    # Every tuvsud.com URL answers 403 to this host, so HTTP could not decide
    # it; the artwork could.
    #
    # The defect was therefore not the value but the CARDINALITY: one field
    # driving two locales, so a reader on an English page saw a badge printed
    # with /ms-cert next to a link to /ms-zert. Each surface now renders the
    # Fundstelle matching its own locale and its own artwork.
    evidence_url: "https://www.tuvsud.com/ms-cert"
    fundstelle_required: true
    fundstelle_url:
      en: "https://www.tuvsud.com/ms-cert"
      de: "https://www.tuvsud.com/ms-zert"
    machine_checkable: false
    machine_checkable_reason: >-
      Every tuvsud.com URL returns HTTP 403 to automated requests from a
      datacenter address, including with a browser user-agent. The link is not
      broken; it refuses robots. A human must confirm it.
  - id: iso-42001
    name: "ISO/IEC 42001:2023 — AI Management System"
    status: in_progress
    issuer: "TÜV SÜD Management Service GmbH"
    stage: "Certification audit contracted (Stage 1 + Stage 2)"
    since: "2026-07-13"
    declared_roles: "AI Producer, AI Provider"
    note: "No certificate has been issued. No certification mark is displayed."

